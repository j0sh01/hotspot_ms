<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/hotspot/login">
      {% if portal_logo_url %}
        <img class="brand-logo" src="{{ portal_logo_url | e }}" alt="" width="28" height="28" />
      {% else %}
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M5 12.5a10 10 0 0 1 14 0" />
            <path d="M8.5 16a5.5 5.5 0 0 1 7 0" />
            <path d="M12 19.5h.01" />
          </svg>
        </span>
      {% endif %}
      <span class="brand-name">{{ portal_brand or "WiFi" }}</span>
    </a>

    <div class="bar-actions">
      <span class="support">
        {% if customer_support_tel %}
          {{ _("Support") }}: <a href="tel:{{ customer_support_tel | e }}">{{ customer_support_number | e }}</a>
        {% endif %}
      </span>

      <div class="lang" role="group" aria-label="{{ _('Language') }}">
        <button type="button" class="{% if lang == 'en' %}is-active{% endif %}" onclick="setLanguage('en')">{{ _("EN") }}</button>
        <button type="button" class="{% if lang != 'en' %}is-active{% endif %}" onclick="setLanguage('sw')">{{ _("SW") }}</button>
      </div>
    </div>
  </div>
</header>

<script>
  function setLanguage(code) {
    document.cookie = "lang=" + code + ";path=/;max-age=31536000";
    window.location.reload();
  }
</script>
